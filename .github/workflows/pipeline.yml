name: Pipeline — Scrape + Send

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 9:00am IST Mon–Fri
  workflow_dispatch:

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
  GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  GMAIL_ACCOUNTS: ${{ secrets.GMAIL_ACCOUNTS }}
  LINKEDIN_COOKIES_JSON: ${{ secrets.LINKEDIN_COOKIES_JSON }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
  BOOKING_LINK: ${{ secrets.BOOKING_LINK }}
  # Email-finder cascade (modules/email_finder.py). Hunter first, Snov fallback.
  # Empty until the free-tier keys are created at hunter.io / snov.io and pasted
  # into the repo secrets — email_finder degrades gracefully when unset.
  HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
  SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
  SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
  # Lead source: OSM (2026-08-15). Was `apollo`, but Apollo's session cookies
  # expire and had been returning 0, so every run was falling through the
  # per-city OSM rescue anyway — paying a failed Apollo attempt per city first.
  # Naming OSM as the primary removes that dead leg. It is keyless and has no
  # quota, so nothing here needs a budget guard.
  # To go back to Apollo: refresh APOLLO_COOKIES_JSON via
  # `python scripts/save_apollo_cookies.py`, then set LEAD_SOURCE=apollo and
  # restore MAX_CITIES_PER_RUN=2 (Apollo's ~5 email-unlocks/day free cap).
  LEAD_SOURCE: osm
  APOLLO_COOKIES_JSON: ${{ secrets.APOLLO_COOKIES_JSON }}
  # 0 = all cities every run. The 2-city window existed purely for Apollo's free
  # allowance; on OSM it just starved the pool the Instagram queue picks from and
  # kept the funnel circling the same two markets.
  MAX_CITIES_PER_RUN: '0'
  # Per-lead demo KV (modules/demo_builder.py publishes /demo/<slug> overrides).
  # Re-pointed 2026-07-04 to the new Upstash DB (old apt-starfish host died).
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Run pipeline
        run: python pipeline.py

      # Today's A-tier Instagram send list, ranked across ALL cities (not just
      # the home market) from every lead ever saved — not only the ones scraped
      # in the run above. Runs even if the scrape failed, because yesterday's
      # pool is still perfectly sendable today.
      - name: Build Instagram queue
        if: always()
        run: python pipeline.py ig_queue

      - name: Commit run metrics
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A runs/   # latest.json, history.jsonl, leads.json, ig_queue.json
          git diff --cached --quiet || git commit -m "chore: run metrics [skip ci]"
          git push
